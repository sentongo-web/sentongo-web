name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-profile-cards.yml"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      # --------------------------------------------------
      # MAIN GITHUB STATS
      # --------------------------------------------------

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=sentongo-web&show_icons=true&include_all_commits=true&title_color=0891b2&text_color=ffffff&icon_color=0891b2&bg_color=1c1917&hide_border=true"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # TOP LANGUAGES
      # --------------------------------------------------

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=sentongo-web&langs_count=10&layout=compact&title_color=0891b2&text_color=ffffff&icon_color=0891b2&bg_color=1c1917&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # GITHUB STREAK
      # --------------------------------------------------

      - name: Generate GitHub streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=sentongo-web&theme=dark&hide_border=true&ring=0891B2&fire=0891B2&currStreakLabel=0891B2&disable_animations=true"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # PINNED REPOSITORY 1
      # --------------------------------------------------

      - name: Generate Kidney Classification repository card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=sentongo-web&repo=Kidney_classification_Using_MLOPS_and_DVC_Data-version-control&title_color=0891b2&text_color=ffffff&icon_color=0891b2&bg_color=1c1917&hide_border=true"
          path: profile/kidney-classification.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # PINNED REPOSITORY 2
      # --------------------------------------------------

      - name: Generate Dental OPG repository card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=sentongo-web&repo=Dental-OPG-XRAY-Analysis-MLOPS&title_color=0891b2&text_color=ffffff&icon_color=0891b2&bg_color=1c1917&hide_border=true"
          path: profile/dental-opg.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # PINNED REPOSITORY 3
      # --------------------------------------------------

      - name: Generate SQL Data Warehouse repository card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=sentongo-web&repo=SQL_datawarehouse_Project&title_color=0891b2&text_color=ffffff&icon_color=0891b2&bg_color=1c1917&hide_border=true"
          path: profile/sql-datawarehouse.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # SAVE GENERATED SVG FILES
      # --------------------------------------------------

      - name: Commit profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Update GitHub profile cards" || exit 0

          git push
